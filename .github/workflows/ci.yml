name: Validação e Testes
on:
  push:
    branches: [ main ]
jobs:
  test:
    name: PHPUnit Tests
    runs-on: ubuntu-latest

    env:
      APP_ENV: test

    steps:
      - uses: actions/checkout@v6
      - name: Iniciando o PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_sqlite, intl, ctype, iconv
          tools: composer:v2

      - name: Criando .env file
        working-directory: ./
        run: cp .env.test .env.test.local

      - name: Instalando as dependências do composer
        working-directory: ./
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Executando o PHPUnit
        working-directory: ./
        run: bin/phpunit


