name: Validação e Testes
on:
  push:
    branches: [ main ]
jobs:
  test:
    name: PHPUnit Tests
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://user_test:password_test@127.0.0.1:5432/db_test?serverVersion=16&charset=utf8

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user_test
          POSTGRES_PASSWORD: password_test
          POSTGRES_DB: db_test
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6
      - name: Iniciando o PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_pgsql, pgsql, intl, ctype, iconv
          tools: composer:v2

      - name: Instalando as dependências do composer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Executando o Migrações
        run: |
          php bin/console --env=test doctrine:database:create --if-not-exists
          php bin/console --env=test doctrine:schema:create

      - name: Executando o PHPUnit
        run: composer run test


